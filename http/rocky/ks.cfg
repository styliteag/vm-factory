# Rocky Linux 10 -- Kickstart fuer den Packer-Build
# Gegenstueck zu http/ubuntu/user-data (autoinstall) und
# http/debian/preseed.cfg (preseed): legt denselben Build-User 'packer' an,
# installiert die Gast-Tools und ueberlaesst den Rest den scripts/*.sh.

text
eula --agreed
reboot --eject

# ---- Sprache / Tastatur / Zeit ----
# Bewusst en_US/us wie bei den anderen OS -- Zeitzone, Locale und Keymap des
# Templates setzt spaeter 20-customize.sh aus den Packer-Variablen.
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# ---- Installationsquelle ----
# ISO + Online-Repos. Die Repos sind NICHT optional: qemu-guest-agent und
# open-vm-tools liegen nicht auf dem minimal-ISO, und ohne den Guest-Agent
# findet Packer die IP der VM nach dem Reboot nie -- der Build laeuft dann in
# den SSH-Timeout, obwohl die Installation sauber durchgelaufen ist.
cdrom
repo --name=baseos-online --mirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=BaseOS-$releasever
repo --name=appstream-online --mirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=$basearch&repo=AppStream-$releasever

# ---- Netzwerk ----
# eth0 existiert hier noch nicht (net.ifnames=0 setzt erst 20-customize.sh);
# --device=link nimmt die erste Karte mit Link.
network --bootproto=dhcp --device=link --activate --hostname=rocky

# ---- Benutzer ----
# root: kein Passwort-Login (SSH-Key kommt aus files/authorized_keys).
rootpw --lock
user --name=packer --password=packer --plaintext --groups=wheel

# ---- Festplatte ----
# Bewusst OHNE LVM und mit / als LETZTER Partition: growroot.service
# vergroessert beim Boot genau diese Partition (growpart braucht freien Platz
# direkt dahinter). XFS ist der Default auf RHEL 10.
ignoredisk --only-use=sda
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype=xfs --size=1024
part / --fstype=xfs --grow

bootloader --location=mbr --timeout=1

# ---- SELinux / Firewall ----
# SELinux bleibt enforcing (Default); 20-customize.sh labelt die selbst
# erzeugten Dateien am Ende per restorecon nach.
selinux --enforcing
firewall --disabled

# ---- Pakete ----
# Bewusst OHNE --ignoremissing: genau das hat den fehlenden qemu-guest-agent
# stillschweigend verschluckt. Lieber ein lauter Abbruch als ein Template ohne
# Guest-Agent.
%packages --excludedocs
@^minimal-environment
openssh-server
sudo
qemu-guest-agent
open-vm-tools
wget
vim-enhanced
cloud-utils-growpart
tar
-plymouth
%end

%post --erroronfail
# Build-User darf passwortlos sudo -- Packer fuehrt die Skripte so aus.
# 99-cleanup.sh entfernt die Datei wieder, remove-packer-user.service loescht
# den Account beim ersten Boot des Klons.
echo 'packer ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-packer
chmod 0440 /etc/sudoers.d/90-packer

systemctl enable sshd

# Guest-Agent schon beim ERSTEN Boot aktiv: Packer ermittelt die VM-IP darueber.
# (00-update.sh macht das spaeter nochmal -- das laeuft aber erst, wenn Packer
# sich bereits per SSH verbunden hat.)
systemctl enable qemu-guest-agent
systemctl enable vmtoolsd 2>/dev/null || true
%end
